services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/helpdesk?serverTimezone=UTC
      DB_USER: root
      DB_PASS: root
      JWT_SECRET: change-this-to-a-long-random-secret-key-123456
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  dbdata:
