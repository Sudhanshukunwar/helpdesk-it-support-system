spring.application.name=helpdesk
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (use a long random secret, min 32 chars)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-123456}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-days=7
app.security.max-failed-attempts=5
app.security.lock-minutes=15
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}

# Server / deployment
server.port=${PORT:8080}
app.production=${APP_PRODUCTION:false}

# First admin (created only if missing). Demo support agent can be turned off in production.
app.seed.admin-email=${ADMIN_EMAIL:admin@helpdesk.com}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.demo-support=${SEED_DEMO_SUPPORT:true}
