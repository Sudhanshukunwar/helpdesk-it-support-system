spring.application.name=helpdesk
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (use a long random secret, min 32 chars)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-123456}
app.jwt.expiration-ms=86400000
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
